<div class="container-sm">
    <h1>Ver Empleados</h1>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Cumpleaños</th>
                <th>DNI</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            @for (empleado of empleado; track $index) {
                <tr>
                    <td>{{empleado.idEmpleado}}</td>
                    <td>{{empleado.nombreEmpleado}}</td>
                    <td>{{empleado.apellidoEmpleado}}</td>
                    <td>{{empleado.fechaCumpleanios}}</td>
                    <td>{{empleado.dniEmpleado}}</td>
                    <td>
                        <button [routerLink]="['/empleados/actualizarEmpleado', empleado.idEmpleado]" class="btn btn-primary m-1">Editar</button>
                        <button (click)="confirmDelete(empleado.idEmpleado)" class="btn btn-danger">Eliminar</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>
